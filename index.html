
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Word Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teachers:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    
    <style id="security-curtain">
        body { display: none !important; }
    </style>
    <script>
        (function() {
            var allowedDomains = ["marknspark", "wix", "google", "localhost", "filesusr"];
            var referrer = document.referrer.toLowerCase();
            var isOriginSafe = allowedDomains.some(function(domain) {
                return referrer.indexOf(domain) > -1;
            });

            if (isOriginSafe) {
                var runUnlock = function() {
                    var curtain = document.getElementById('security-curtain');
                    if (curtain) curtain.parentNode.removeChild(curtain);
                };
                window.addEventListener('DOMContentLoaded', runUnlock);
                window.onload = runUnlock;
            } else {
                var style = document.createElement('style');
                style.innerHTML = 'body { display: block !important; background-color: #f0f0f0; }';
                document.head.appendChild(style);
                document.addEventListener('DOMContentLoaded', function() {
                    document.body.innerHTML = `
                        <div style="font-family:sans-serif; text-align:center; padding:50px;">
                            <div style="background:white; padding:40px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.1);">
                                <h2 style="color:#d32f2f;">Access Restricted</h2>
                                <p>Please launch this tool from the <a href="https://www.marknspark.com">Mark 'n' Spark Portal</a>.</p>
                            </div>
                        </div>`;
                });
            }
        })();
    </script>

    <style>
        body { font-family: 'Teachers', sans-serif; }
        .sparkle-text {
            background: linear-gradient(45deg, #2563eb, #7c3aed, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: shine 3s ease infinite;
        }
        @keyframes shine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .mic-active { animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16 items-center">
                <div class="text-xl font-black text-slate-800 uppercase tracking-tight">
                    Site Word <span class="text-purple-600">Lab</span>
                </div>
                <div class="flex items-center gap-4">
                    <div id="sticker-display" class="bg-yellow-100 text-yellow-700 px-4 py-1 rounded-full font-bold text-sm">
                        ⭐ 0 Stickers
                    </div>
                    <button id="mode-toggle" class="text-xs text-slate-400 hover:text-purple-600 font-medium">
                        Teacher Mode
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex flex-col items-center justify-center p-4">
        
        <div id="teacher-view" class="w-full max-w-4xl bg-white rounded-2xl shadow-xl p-8 hidden">
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Teacher Dashboard</h2>
            <p class="text-slate-500 mb-6">Select the words to practice in this session:</p>
            
            <div class="flex justify-between mb-4">
                <button onclick="selectAll()" class="text-sm text-purple-600 font-bold hover:underline">Select All</button>
                <button onclick="clearAll()" class="text-sm text-slate-400 hover:text-slate-600">Clear All</button>
            </div>

            <div id="word-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 mb-8 max-h-[400px] overflow-y-auto p-2 border border-slate-100 rounded-lg">
                </div>

            <button onclick="startSession()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 rounded-xl text-lg shadow-lg transition-transform transform active:scale-95">
                Start Student Session
            </button>
        </div>

        <div id="student-view" class="w-full max-w-2xl text-center hidden">
            
            <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-12 border-4 border-slate-100 relative overflow-hidden">
                <div class="mb-12 relative z-10">
                    <h1 id="display-word" class="text-6xl md:text-8xl font-black text-slate-800 tracking-tight mb-4">
                        ...
                    </h1>
                    <p class="text-slate-400 font-medium uppercase tracking-widest text-sm">Read the word above</p>
                </div>

                <div id="feedback-area" class="h-16 mb-8 flex items-center justify-center">
                    <p id="feedback-text" class="text-xl text-slate-500 font-medium">
                        Click the mic and say the word!
                    </p>
                </div>

                <div class="flex flex-col items-center gap-6 relative z-10">
                    <button id="mic-btn" class="w-24 h-24 rounded-full bg-purple-600 hover:bg-purple-500 text-white shadow-xl flex items-center justify-center transition-all transform hover:scale-105">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                        </svg>
                    </button>
                    
                    <div class="flex gap-4">
                        <button onclick="playWordAudio()" class="px-6 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg font-bold text-sm flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                            </svg>
                            Hear Word
                        </button>
                        <button onclick="skipWord()" class="px-6 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg font-bold text-sm">
                            Skip &rarr;
                        </button>
                    </div>
                </div>

                <div class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-purple-100 rounded-full blur-3xl opacity-50 pointer-events-none"></div>
                <div class="absolute bottom-0 left-0 -mb-10 -ml-10 w-40 h-40 bg-blue-100 rounded-full blur-3xl opacity-50 pointer-events-none"></div>
            </div>

            <button onclick="endSession()" class="mt-8 text-slate-400 hover:text-slate-600 text-sm font-medium underline">
                End Session & Return to Teacher Mode
            </button>
        </div>
    </main>

    <script>
        // --- DATA ---
        // Basic list of sight words
        const allSightWords = [
            'the', 'of', 'and', 'a', 'to', 'in', 'is', 'you', 'that', 'it', 
            'he', 'was', 'for', 'on', 'are', 'as', 'with', 'his', 'they', 'I', 
            'at', 'be', 'this', 'have', 'from', 'or', 'one', 'had', 'by', 'word',
            'but', 'not', 'what', 'all', 'were', 'we', 'when', 'your', 'can', 'said'
        ];

        let selectedWords = [];
        let practiceQueue = [];
        let currentWord = "";
        let stickers = 0;
        let audioContext = null;
        let isTeacherMode = true;

        // --- INIT ---
        window.addEventListener('DOMContentLoaded', () => {
            renderTeacherGrid();
            toggleMode(true); // Start in teacher mode
        });

        // --- TEACHER MODE FUNCTIONS ---
        function renderTeacherGrid() {
            const grid = document.getElementById('word-grid');
            grid.innerHTML = '';
            
            allSightWords.forEach((word, index) => {
                // Create checkbox container
                const wrapper = document.createElement('div');
                wrapper.className = "flex items-center space-x-2 bg-slate-50 p-2 rounded hover:bg-purple-50 transition-colors";
                
                const checkbox = document.createElement('input');
                checkbox.type = "checkbox";
                checkbox.id = `word-${index}`;
                checkbox.value = word;
                checkbox.checked = true; // Default selected
                checkbox.className = "w-5 h-5 text-purple-600 rounded focus:ring-purple-500 border-gray-300";
                
                const label = document.createElement('label');
                label.htmlFor = `word-${index}`;
                label.innerText = word;
                label.className = "text-slate-700 font-medium cursor-pointer flex-grow";
                
                wrapper.appendChild(checkbox);
                wrapper.appendChild(label);
                grid.appendChild(wrapper);
            });
        }

        function selectAll() {
            document.querySelectorAll('#word-grid input').forEach(cb => cb.checked = true);
        }

        function clearAll() {
            document.querySelectorAll('#word-grid input').forEach(cb => cb.checked = false);
        }

        function startSession() {
            // Get selected words
            const checkboxes = document.querySelectorAll('#word-grid input:checked');
            selectedWords = Array.from(checkboxes).map(cb => cb.value);

            if (selectedWords.length === 0) {
                alert("Please select at least one word!");
                return;
            }

            // Shuffle words for the queue
            practiceQueue = [...selectedWords].sort(() => Math.random() - 0.5);
            
            toggleMode(false);
            nextWord();
        }

        // --- STUDENT MODE FUNCTIONS ---
        function nextWord() {
            if (practiceQueue.length === 0) {
                // Reshuffle if empty
                practiceQueue = [...selectedWords].sort(() => Math.random() - 0.5);
            }
            currentWord = practiceQueue.pop();
            
            // Update UI
            document.getElementById('display-word').innerText = currentWord;
            document.getElementById('display-word').classList.remove('sparkle-text');
            document.getElementById('feedback-text').innerText = "Click the mic and read the word!";
            document.getElementById('feedback-text').className = "text-xl text-slate-500 font-medium";
        }

        function playWordAudio() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(currentWord);
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function skipWord() {
            nextWord();
        }

        // --- SPEECH RECOGNITION ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const micBtn = document.getElementById('mic-btn');

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            micBtn.addEventListener('click', () => {
                // Init Audio Context for sounds (needs user gesture)
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') audioContext.resume();

                micBtn.classList.add('mic-active', 'bg-red-500');
                micBtn.classList.remove('bg-purple-600');
                document.getElementById('feedback-text').innerText = "Listening...";
                recognition.start();
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase().trim();
                const target = currentWord.toLowerCase().trim();
                
                stopMicVisuals();

                if (transcript.includes(target)) {
                    // SUCCESS
                    handleSuccess();
                } else {
                    // FAILURE
                    document.getElementById('feedback-text').innerHTML = `I heard <strong>"${transcript}"</strong>. Try again!`;
                    document.getElementById('feedback-text').className = "text-xl text-red-500 font-bold";
                    playErrorSound();
                }
            };

            recognition.onerror = (event) => {
                stopMicVisuals();
                document.getElementById('feedback-text').innerText = "Didn't catch that. Click to try again.";
            };

            recognition.onend = stopMicVisuals;

        } else {
            micBtn.style.display = 'none';
            document.getElementById('feedback-text').innerText = "Speech recognition not supported in this browser.";
        }

        function stopMicVisuals() {
            micBtn.classList.remove('mic-active', 'bg-red-500');
            micBtn.classList.add('bg-purple-600');
        }

        function handleSuccess() {
            playSuccessChord();
            addSticker();
            
            const display = document.getElementById('display-word');
            display.classList.add('sparkle-text');
            
            document.getElementById('feedback-text').innerText = "Great job! ✨";
            document.getElementById('feedback-text').className = "text-xl text-green-600 font-bold";

            setTimeout(() => {
                nextWord();
            }, 1500);
        }

        // --- AUDIO & GAMIFICATION ---
        function playErrorSound() {
            if (!audioContext) return;
            const ctx = audioContext;
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.frequency.value = 200;
            osc.type = 'sawtooth';
            g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
            osc.start(); osc.stop(ctx.currentTime + 0.3);
        }

        function playSuccessChord() {
            if (!audioContext) return;
            const ctx = audioContext;
            const now = ctx.currentTime;
            [523.25, 659.25, 783.99].forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + (i * 0.05));
                gain.gain.setValueAtTime(0.1, now + (i * 0.05));
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5 + (i * 0.05));
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + (i * 0.05));
                osc.stop(now + 0.6 + (i * 0.05));
            });
        }

        function addSticker() {
            stickers++;
            document.getElementById('sticker-display').innerText = `⭐ ${stickers} Stickers`;
        }

        // --- NAVIGATION ---
        document.getElementById('mode-toggle').addEventListener('click', () => {
            isTeacherMode = !isTeacherMode;
            toggleMode(isTeacherMode);
        });

        function endSession() {
            toggleMode(true);
        }

        function toggleMode(teacher) {
            const teacherView = document.getElementById('teacher-view');
            const studentView = document.getElementById('student-view');
            
            if (teacher) {
                teacherView.classList.remove('hidden');
                studentView.classList.add('hidden');
            } else {
                teacherView.classList.add('hidden');
                studentView.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
